# Included inside the Release server block by compose.local-release.yaml only.
# Only public protocol routes; fixture control routes remain private.
location ~ ^/realms/stock-ai-release/(?:authorize|token|jwks|logout|\.well-known/openid-configuration)$ {
    proxy_pass https://idp:8443;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /run/release-tls/fullchain.pem;
    proxy_ssl_server_name on;
    proxy_ssl_name app.localrelease;
    proxy_set_header Host app.localrelease:8443;
}
