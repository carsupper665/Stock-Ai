# Release behind the host's own Nginx: use with compose.yaml only, in place of compose.release.yaml.
# The host Nginx terminates TLS, serves the frontend and proxies to the middleware published on
# 127.0.0.1 only; its configuration is in docs/deployment/remote-windows-release.md.
# The Docker Nginx (compose.release.yaml, compose.test-edge.yaml) remains for Test.
services:
  backend:
    user: "65532:${LOCAL_RELEASE_GID:?set private Release container group}"
    volumes:
      - "${OIDC_CA_BUNDLE:?set OIDC_CA_BUNDLE to a PEM file with extra IdP CA/intermediate certificates (may be empty)}:/etc/ssl/certs/oidc-ca.pem:ro"
  agent-server:
    user: "65532:${LOCAL_RELEASE_GID}"
    volumes:
      - "${OIDC_CA_BUNDLE}:/etc/ssl/certs/oidc-ca.pem:ro"
  llm-provider-server:
    user: "65532:${LOCAL_RELEASE_GID}"
    environment:
      CODEX_CA_CERTIFICATE: "${CODEX_CA_CERTIFICATE:-}"
    volumes:
      - "${OIDC_CA_BUNDLE}:/etc/ssl/certs/oidc-ca.pem:ro"
  middleware:
    user: "65532:${LOCAL_RELEASE_GID}"
    environment:
      STOCK_AI_ENVIRONMENT: Release
    volumes:
      - "${OIDC_CA_BUNDLE}:/etc/ssl/certs/oidc-ca.pem:ro"
    ports:
      - "127.0.0.1:${MIDDLEWARE_HOST_PORT:-4180}:4180"
