worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    log_format edge_sanitized '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';
    access_log /dev/stdout edge_sanitized;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;
    limit_req_status 429;

    map $uri $console_authorization {
        ~^/v1(?:/|$) $http_authorization;
        default "";
    }
    server_tokens off;
    client_max_body_size 1m;

    include /tmp/test-edge.conf;
}
