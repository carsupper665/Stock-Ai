name: "${STOCK_AI_INSTANCE:?set STOCK_AI_INSTANCE to an environment-unique slug}"

x-runtime: &runtime
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
  pids_limit: 256
  stop_signal: SIGTERM
  stop_grace_period: 30s
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "5"

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 3s
  start_period: 10s
  retries: 12

services:
  backend:
    <<: *runtime
    image: "${BACKEND_IMAGE:?set BACKEND_IMAGE to the approved Backend image reference}"
    environment:
      STOCK_AI_ENVIRONMENT: "${STOCK_AI_ENVIRONMENT:?set STOCK_AI_ENVIRONMENT to Test or Release}"
      USER_TOKEN_FILE: "/run/secrets/${STOCK_AI_SECRET_NAMESPACE:?set STOCK_AI_SECRET_NAMESPACE}_backend_middleware_token"
      AGENT_SERVICE_TOKEN_FILE: "/run/secrets/${STOCK_AI_SECRET_NAMESPACE}_backend_user_token"
      ACCOUNT_TOKEN_KEY_FILE: "/run/secrets/${STOCK_AI_SECRET_NAMESPACE}_backend_account_token_key"
      BACKEND_ADDR: "0.0.0.0:7794"
      DB_DRIVER: sqlite
      DB_DSN: /data/backend.db
      LOG_DIR: /data/logs
      DEBUG: "false"
    secrets:
      - source: backend_middleware_token
        target: "${STOCK_AI_SECRET_NAMESPACE}_backend_middleware_token"
      - source: backend_user_token
        target: "${STOCK_AI_SECRET_NAMESPACE}_backend_user_token"
      - source: backend_account_token_key
        target: "${STOCK_AI_SECRET_NAMESPACE}_backend_account_token_key"
    volumes:
      - backend_state:/data
    networks:
      application:
        aliases:
          - backend
    expose:
      - "7794"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/healthcheck", "http://127.0.0.1:7794/v1/health"]
    mem_limit: 512m
    cpus: 1.0

  llm-provider-server:
    <<: *runtime
    image: "${LLM_PROVIDER_SERVER_IMAGE:?set LLM_PROVIDER_SERVER_IMAGE to the approved LLM Provider Server image reference}"
    environment:
      STOCK_AI_ENVIRONMENT: "${STOCK_AI_ENVIRONMENT}"
      LLM_SERVER_ADDR: "0.0.0.0:8090"
      LLM_SERVER_DB_PATH: /data/llm-provider.db
      LLM_SERVER_ADMIN_TOKEN_FILE: "/run/secrets/${STOCK_AI_SECRET_NAMESPACE}_llm_admin_token"
      LLM_SERVER_RUNTIME_TOKEN_FILE: "/run/secrets/${STOCK_AI_SECRET_NAMESPACE}_llm_runtime_token"
      LLM_SERVER_MASTER_KEY_FILE: "/run/secrets/${STOCK_AI_SECRET_NAMESPACE}_llm_master_key"
      LLM_SERVER_MODEL_CATALOG: "${LLM_SERVER_MODEL_CATALOG:-[]}"
    secrets:
      - source: llm_admin_token
        target: "${STOCK_AI_SECRET_NAMESPACE}_llm_admin_token"
      - source: llm_runtime_token
        target: "${STOCK_AI_SECRET_NAMESPACE}_llm_runtime_token"
      - source: llm_master_key
        target: "${STOCK_AI_SECRET_NAMESPACE}_llm_master_key"
    volumes:
      - llm_state:/data
    networks:
      application:
        aliases:
          - llm-provider-server
    expose:
      - "8090"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/healthcheck", "http://127.0.0.1:8090/healthz"]
    mem_limit: 512m
    cpus: 1.0

  agent-server:
    <<: *runtime
    image: "${AGENT_SERVER_IMAGE:?set AGENT_SERVER_IMAGE to the approved Agent Server image reference}"
    environment:
      STOCK_AI_ENVIRONMENT: "${STOCK_AI_ENVIRONMENT}"
      AGENT_SERVER_ADDR: "0.0.0.0:8080"
      AGENT_SERVER_DB_PATH: /data/agent-server.db
      AGENT_SERVER_HISTORY_DIR: /data/history
      AGENT_SERVER_ADMIN_TOKEN_FILE: "/run/secrets/${STOCK_AI_SECRET_NAMESPACE}_agent_admin_token"
      AGENT_SERVER_BACKEND_URL: http://backend:7794
      AGENT_SERVER_BACKEND_USER_TOKEN_FILE: "/run/secrets/${STOCK_AI_SECRET_NAMESPACE}_backend_user_token"
      AGENT_SERVER_GATEWAY_URL: http://llm-provider-server:8090
      AGENT_SERVER_GATEWAY_RUNTIME_TOKEN_FILE: "/run/secrets/${STOCK_AI_SECRET_NAMESPACE}_llm_runtime_token"
    secrets:
      - source: agent_admin_token
        target: "${STOCK_AI_SECRET_NAMESPACE}_agent_admin_token"
      - source: backend_user_token
        target: "${STOCK_AI_SECRET_NAMESPACE}_backend_user_token"
      - source: llm_runtime_token
        target: "${STOCK_AI_SECRET_NAMESPACE}_llm_runtime_token"
    volumes:
      - agent_state:/data
    networks:
      application:
        aliases:
          - agent-server
    expose:
      - "8080"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
      llm-provider-server:
        condition: service_healthy
        restart: true
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/healthcheck", "http://127.0.0.1:8080/health"]
    mem_limit: 768m
    cpus: 1.5

  middleware:
    <<: *runtime
    image: "${MIDDLEWARE_IMAGE:?set MIDDLEWARE_IMAGE to the approved Middleware image reference}"
    environment:
      STOCK_AI_ENVIRONMENT: "${STOCK_AI_ENVIRONMENT}"
      MIDDLEWARE_ADDR: ":4180"
      BACKEND_URL: http://backend:7794
      AGENT_SERVER_URL: http://agent-server:8080
      LLM_SERVER_URL: http://llm-provider-server:8090
      AGENT_SERVER_ADMIN_TOKEN_FILE: "/run/secrets/${STOCK_AI_SECRET_NAMESPACE}_agent_admin_token"
      LLM_SERVER_ADMIN_TOKEN_FILE: "/run/secrets/${STOCK_AI_SECRET_NAMESPACE}_llm_admin_token"
      LLM_SERVER_RUNTIME_TOKEN_FILE: "/run/secrets/${STOCK_AI_SECRET_NAMESPACE}_llm_runtime_token"
      BACKEND_USER_TOKEN_FILE: "/run/secrets/${STOCK_AI_SECRET_NAMESPACE}_backend_middleware_token"
      OIDC_ISSUER: "${OIDC_ISSUER:?set the exact IdP issuer}"
      OIDC_AUTHORIZATION_URL: "${OIDC_AUTHORIZATION_URL:?set the IdP authorization endpoint}"
      OIDC_TOKEN_URL: "${OIDC_TOKEN_URL:?set the IdP token endpoint}"
      OIDC_JWKS_URL: "${OIDC_JWKS_URL:?set the IdP JWKS endpoint}"
      OIDC_END_SESSION_URL: "${OIDC_END_SESSION_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:?set the IdP client ID}"
      OIDC_CLIENT_SECRET_FILE: "/run/secrets/${STOCK_AI_SECRET_NAMESPACE}_oidc_client_secret"
      OIDC_COOKIE_KEY_FILE: "/run/secrets/${STOCK_AI_SECRET_NAMESPACE}_oidc_cookie_key"
      OIDC_REDIRECT_URI: "${OIDC_REDIRECT_URI:?set the exact https://<app host>/oauth2/callback}"
      OIDC_POST_LOGOUT_URI: "${OIDC_POST_LOGOUT_URI:?set the exact https://<app host>/}"
      OIDC_COOKIE_NAME: "${OIDC_COOKIE_NAME:?set __Host-stock-ai-<environment>-session}"
      OIDC_USER_SUBJECT: "${OIDC_USER_SUBJECT:?set the allowed IdP subject}"
      OIDC_AUDIENCE: "${OIDC_AUDIENCE:?set the API audience in the access token}"
      OIDC_TOKEN_TYPE: "${OIDC_TOKEN_TYPE:-at+jwt}"
      OIDC_TOKEN_AUTH_METHOD: "${OIDC_TOKEN_AUTH_METHOD:-client_secret_basic}"
    secrets:
      - source: agent_admin_token
        target: "${STOCK_AI_SECRET_NAMESPACE}_agent_admin_token"
      - source: llm_admin_token
        target: "${STOCK_AI_SECRET_NAMESPACE}_llm_admin_token"
      - source: llm_runtime_token
        target: "${STOCK_AI_SECRET_NAMESPACE}_llm_runtime_token"
      - source: backend_middleware_token
        target: "${STOCK_AI_SECRET_NAMESPACE}_backend_middleware_token"
      - source: oidc_client_secret
        target: "${STOCK_AI_SECRET_NAMESPACE}_oidc_client_secret"
      - source: oidc_cookie_key
        target: "${STOCK_AI_SECRET_NAMESPACE}_oidc_cookie_key"
    networks:
      - application
      - edge
    expose:
      - "4180"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
      llm-provider-server:
        condition: service_healthy
        restart: true
      agent-server:
        condition: service_healthy
        restart: true
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/healthcheck", "http://127.0.0.1:4180/healthz"]
    stop_grace_period: 20s
    mem_limit: 256m
    cpus: 0.5

networks:
  application:
    name: "${STOCK_AI_INSTANCE}_application"
    labels:
      stock-ai.environment: "${STOCK_AI_ENVIRONMENT}"
      stock-ai.boundary: private-application
  edge:
    name: "${STOCK_AI_INSTANCE}_edge"
    labels:
      stock-ai.environment: "${STOCK_AI_ENVIRONMENT}"
      stock-ai.boundary: designated-edge

volumes:
  backend_state:
    name: "${STOCK_AI_INSTANCE}_backend_state"
    labels:
      stock-ai.environment: "${STOCK_AI_ENVIRONMENT}"
      stock-ai.owner: backend
  agent_state:
    name: "${STOCK_AI_INSTANCE}_agent_state"
    labels:
      stock-ai.environment: "${STOCK_AI_ENVIRONMENT}"
      stock-ai.owner: agent-server
  llm_state:
    name: "${STOCK_AI_INSTANCE}_llm_state"
    labels:
      stock-ai.environment: "${STOCK_AI_ENVIRONMENT}"
      stock-ai.owner: llm-provider-server

secrets:
  backend_user_token:
    file: "${STOCK_AI_SECRETS_DIR:?set STOCK_AI_SECRETS_DIR}/${STOCK_AI_SECRET_NAMESPACE}_backend_user_token"
  backend_middleware_token:
    file: "${STOCK_AI_SECRETS_DIR}/${STOCK_AI_SECRET_NAMESPACE}_backend_middleware_token"
  backend_account_token_key:
    file: "${STOCK_AI_SECRETS_DIR}/${STOCK_AI_SECRET_NAMESPACE}_backend_account_token_key"
  agent_admin_token:
    file: "${STOCK_AI_SECRETS_DIR}/${STOCK_AI_SECRET_NAMESPACE}_agent_admin_token"
  llm_admin_token:
    file: "${STOCK_AI_SECRETS_DIR}/${STOCK_AI_SECRET_NAMESPACE}_llm_admin_token"
  llm_runtime_token:
    file: "${STOCK_AI_SECRETS_DIR}/${STOCK_AI_SECRET_NAMESPACE}_llm_runtime_token"
  llm_master_key:
    file: "${STOCK_AI_SECRETS_DIR}/${STOCK_AI_SECRET_NAMESPACE}_llm_master_key"
  oidc_client_secret:
    file: "${STOCK_AI_SECRETS_DIR}/${STOCK_AI_SECRET_NAMESPACE}_oidc_client_secret"
  oidc_cookie_key:
    file: "${STOCK_AI_SECRETS_DIR}/${STOCK_AI_SECRET_NAMESPACE}_oidc_cookie_key"
